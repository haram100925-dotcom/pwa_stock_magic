name: Deploy to Dothome FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Safe Upload PWA + PHP to /html/stock/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Clean excluded PWA files before upload
        run: |
          rm -rf dist/dist.zip dist/assets/aistudio dist/.well-known dist/.htaccess

      - name: Upload ./stock PHP & ./dist PWA to /html/stock/ via lftp (NO delete, exclude DB config)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:timeout 20;
            set net:max-retries 3;
            mirror --reverse --no-perms --verbose \
              --exclude-glob '*accsesDB.php' \
              --exclude-glob 'index.html' \
              --exclude-glob '*.log' \
              --exclude-glob '.ftp-deploy-sync-state.json' \
              ./stock /html/stock;
            mirror --reverse --no-perms --verbose ./dist /html/stock;
            bye
          "
